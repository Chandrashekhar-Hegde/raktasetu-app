providers = []

[phases.setup]
nixPkgs = ["nodejs_22"]  # keep in step with .nvmrc
# Nixpacks' default nixpkgs snapshot predates nodejs_22; pin nixos-24.11 (Node 22.16.0).
nixpkgsArchive = "50ab793786d9de88ee30ec4e4c24fb4236fc2674"

[phases.install]
cmds = ["echo 'deps install deferred to build'"]

[phases.build]
cmds = [
  "cd backend && npm ci --omit=dev",
  "cd frontend && npm ci --include=dev && npx vite build"
]

# No [start]: each Railway service sets its own start command (API vs the two crons).
# A start fallback here would make a cron with a blank start command boot the API and never exit.
