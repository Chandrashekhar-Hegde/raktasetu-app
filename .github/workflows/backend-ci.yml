name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    # No paths filter on PRs: these are required checks, and a filtered-out
    # workflow never reports, which would block every PR that doesn't touch it.

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Real Postgres so RLS, redemption, deletion and route tests run instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raktasetu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raktasetu_test
      FIXTURE_PASSWORD: ci-fixture-Password-123!
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Prepare test database (base schema, migrations, fixtures)
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
          npm run db:test:migrate
          npm run db:test:fixtures

      - name: Run tests (no skips allowed)
        run: |
          npm test 2>&1 | tee test.log
          # A skipped DB test is how RLS went untested before; fail loudly instead.
          # TAP ("# skipped 0") in CI, spec ("ℹ skipped 0") in a terminal.
          grep -qE '^(#|ℹ) skipped 0$' test.log || (echo "::error::Tests were skipped; is TEST_DATABASE_URL wired?" && exit 1)

      - name: Check syntax
        run: |
          shopt -s globstar
          for file in src/**/*.js scripts/*.js; do node --check "$file"; done

      - name: Start server (health check)
        env:
          # Health is in-process and does not need a real database.
          # Do not wire MIGRATION_DATABASE_URL here (app boot refuses it in production).
          JWT_SECRET: ci-health-check-not-for-production
          NODE_ENV: test
          PORT: 3001
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 5
          curl -sf http://localhost:3001/api/health || (echo "Health check failed" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID || true
        timeout-minutes: 2
